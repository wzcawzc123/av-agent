<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AV Agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>🎧 AV Agent</h1>
    <div class="header-btns">
      <button id="btnProducts" title="产品库">📦</button>
      <button id="btnTemplates" title="模板库">🗂️</button>
      <button id="btnSettings" title="模型配置">⚙️</button>
    </div>
  </header>
  <main id="chat-app">
    <div id="chat-log"></div>
    <div id="confirm-card" hidden></div>
    <div id="progress-bar" hidden><div id="progress-fill"></div><span id="progress-text"></span></div>
    <div id="file-list"></div>
    <form id="chat-form">
      <input id="chat-input" placeholder="例如：100平会议室方案" autocomplete="off">
      <button type="submit">发送</button>
    </form>
  </main>

  <div id="settings-drawer" class="drawer" hidden>
    <h3>模型提供商</h3>
    <p class="drawer-hint">内置主流模型（OpenAI/Anthropic/百炼/DeepSeek/Kimi/MiMo/MiniMax/阶跃/硅基流动/OpenRouter/GLM/文心/Gemini），也可自定义新增</p>
    <button id="prov-add">➕ 新增自定义提供商</button>
    <div id="prov-list"></div>
    <div id="update-sec" class="update-sec">
      <h4>🔄 软件更新</h4>
      <input id="upd-url" placeholder="更新检查地址（默认 GitHub Releases）">
      <input id="upd-token" type="password" placeholder="GitHub Token（私有仓库选填）">
      <div class="upd-btns">
        <button id="upd-save">保存更新配置</button>
        <button id="upd-check">检查更新</button>
      </div>
      <div id="upd-result" class="drawer-result"></div>
    </div>
    <button id="cfg-close" class="btn-ghost">关闭</button>
  </div>

  <div id="prov-edit-drawer" class="drawer" hidden>
    <h3 id="prov-edit-title">编辑提供商</h3>
    <input id="pe-name" placeholder="提供商名称">
    <select id="pe-type">
      <option value="openai_compatible">OpenAI 兼容</option>
      <option value="anthropic">Anthropic</option>
      <option value="gemini">Gemini</option>
    </select>
    <input id="pe-base" placeholder="Base URL（如 https://api.xxx.com/v1）">
    <input id="pe-key" type="password" placeholder="API Key">
    <input id="pe-models" placeholder="模型列表，逗号分隔（如 gpt-4o,gpt-4o-mini）">
    <button id="pe-save">保存</button>
    <button id="pe-fetch">远程拉取模型</button>
    <div id="pe-result" class="drawer-result"></div>
    <button id="pe-close" class="btn-ghost">返回</button>
  </div>

  <div id="products-drawer" class="drawer" hidden>
    <h3>产品库</h3>
    <p class="drawer-hint">上传公司产品 Excel（表头：产品名称 | 型号 | 参数 | 底价 | 市场价 | 分类）</p>
    <input id="prod-file" type="file" accept=".xlsx,.xls">
    <button id="prod-upload">上传导入</button>
    <div id="prod-result" class="drawer-result"></div>
    <div id="prod-list"></div>
    <button id="prod-close" class="btn-ghost">关闭</button>
  </div>

  <div id="templates-drawer" class="drawer" hidden>
    <h3>模板库</h3>
    <p class="drawer-hint">注册模板；常规配置模板按面积自动匹配</p>
    <input id="tpl-name" placeholder="模板名称">
    <select id="tpl-type">
      <option value="config">常规配置模板（按面积）</option>
      <option value="doc">文字方案模板(Word)</option>
      <option value="ppt">PPT 母版</option>
      <option value="deviation">偏离表模板(Excel)</option>
    </select>
    <div id="tpl-config-fields">
      <input id="tpl-area" type="number" placeholder="适用面积（㎡），如 100">
      <input id="tpl-scene" placeholder="场景（可选），如 会议室">
    </div>
    <input id="tpl-path" placeholder="文件路径，如 D:/tpl/方案模板.docx">
    <input id="tpl-desc" placeholder="描述（可选）">
    <button id="tpl-add">注册模板</button>
    <div id="tpl-list"></div>
    <button id="tpl-close" class="btn-ghost">关闭</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
